name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          echo "coverage=${total}%"
          awk -v t="$total" 'BEGIN { if ((t+0) < 45) { print "coverage below 45%: " t; exit 1 } }'
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Build
        run: go build -ldflags "-X github.com/symbolsecurity/cli/internal/version.Commit=${GITHUB_SHA}" -o bin/symbol ./cmd/symbol
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

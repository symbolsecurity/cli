version: 2

project_name: symbol

builds:
  - id: symbol
    main: ./cmd/symbol
    binary: symbol
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/symbolsecurity/cli/internal/version.Version={{.Version}} -X github.com/symbolsecurity/cli/internal/version.Commit={{.ShortCommit}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"

release:
  github:
    owner: symbolsecurity
    name: cli
  draft: false
  mode: append
  make_latest: true
